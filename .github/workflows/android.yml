# R01-P2-01: compile and unit-test evidence for the Android client.
#
# The remediation sandbox has no Android SDK and cannot reach Google Maven, so the build runs on a
# GitHub runner. Diagnostics are published to the `ci-logs` branch on failure because the sandbox
# cannot read Actions logs directly.
name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          ok=""
          for url in \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip; do
            if curl -fsSL -o /tmp/cmdline-tools.zip "$url"; then echo "downloaded $url"; ok=1; break; fi
          done
          test -n "$ok"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37" "build-tools;37.0.0" \
            || sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | tee "$HOME/sdk-installed.txt"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug Kotlin
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee compile.log

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee unit-tests.log

      - name: Publish diagnostics on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          sdkmanager --list > ci-logs/sdkmanager.txt 2>&1 || true
          cp compile.log ci-logs/ 2>/dev/null || true
          cp unit-tests.log ci-logs/ 2>/dev/null || true
          mkdir -p ci-logs/test-results
          cp app/build/test-results/testDebugUnitTest/*.xml ci-logs/test-results/ 2>/dev/null || true
          printf 'run: %s\ncommit: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > ci-logs/README.txt
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI diagnostics"
          git checkout --orphan ci-logs-publish
          git add -f ci-logs
          git commit -m "ci: android diagnostics for $GITHUB_SHA"
          git push -f origin HEAD:ci-logs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
