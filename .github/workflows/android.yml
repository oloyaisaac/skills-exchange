# R01-P2-01: compile and unit-test evidence for the Android client.
#
# The remediation sandbox has no Android SDK and cannot reach Google Maven, so the build runs on a
# GitHub runner. Diagnostics are published to the `ci-logs` branch on failure because the sandbox
# cannot read Actions logs directly.
name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          ok=""
          for url in \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip; do
            if curl -fsSL -o /tmp/cmdline-tools.zip "$url"; then echo "downloaded $url"; ok=1; break; fi
          done
          test -n "$ok"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37" "build-tools;37.0.0" \
            || sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | tee "$HOME/sdk-installed.txt"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug Kotlin
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee compile.log

      # R04-P2-01: Room writes its schema JSON during compilation. The remediation sandbox cannot
      # run Gradle, so the generated files are published to the `ci-schema` branch and committed
      # from there; the test run above can only validate what is actually committed.
      - name: Publish generated Room schema
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d app/schemas ]; then echo "no schema directory"; exit 0; fi
          mkdir -p /tmp/schema-publish && cd /tmp/schema-publish
          git init -q .
          cp -r "$GITHUB_WORKSPACE/app/schemas" ./schemas
          git add -A
          git -c user.email=ci@users.noreply.github.com -c user.name="CI schema" \
            commit -qm "ci: room schemas for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            HEAD:ci-schema

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee unit-tests.log

      # R11-P2-05: coverage is measured and gated, not assumed.
      - name: Unit-test coverage (JaCoCo)
        run: |
          set -o pipefail
          ./gradlew :app:jacocoTestReport :app:jacocoTestCoverageVerification \
            --stacktrace --no-daemon 2>&1 | tee coverage.log

      - name: Summarise coverage
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          files = glob.glob("app/build/reports/jacoco/**/jacoco*.xml", recursive=True) + \
                  glob.glob("app/build/reports/jacoco/test/jacocoTestReport.xml")
          rows = []
          for path in sorted(set(files)):
              root = ET.parse(path).getroot()
              for counter in root.findall("counter"):
                  if counter.get("type") == "LINE":
                      missed = int(counter.get("missed")); covered = int(counter.get("covered"))
                      total = missed + covered
                      pct = (covered / total * 100) if total else 0.0
                      rows.append(f"LINE coverage: {pct:.2f}% ({covered}/{total}) from {path}")
          with open("coverage-summary.txt", "w") as out:
              out.write("\n".join(rows) + "\n" if rows else "no coverage XML found\n")
          print(open("coverage-summary.txt").read())
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage
          path: |
            app/build/reports/jacoco/**
            coverage-summary.txt
          if-no-files-found: ignore

      - name: Publish diagnostics on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          sdkmanager --list > ci-logs/sdkmanager.txt 2>&1 || true
          # R12: copy every log the job writes, not a fixed list — a step that fails before its own
          # log is named was exactly the case that left no evidence to read.
          cp -f *.log ci-logs/ 2>/dev/null || true
          mkdir -p ci-logs/test-results
          cp app/build/test-results/testDebugUnitTest/*.xml ci-logs/test-results/ 2>/dev/null || true
          mkdir -p ci-logs/reports
          cp -r app/build/reports/jacoco ci-logs/reports/ 2>/dev/null || true
          {
            printf 'run: %s\ncommit: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf '\n-- workspace logs --\n'
            ls -la *.log 2>/dev/null || echo '(none)'
            printf '\n-- test results --\n'
            ls -la app/build/test-results/testDebugUnitTest 2>/dev/null | head -20 || echo '(none)'
          } > ci-logs/README.txt
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI diagnostics"
          git checkout --orphan ci-logs-publish
          git add -f ci-logs
          git commit -m "ci: android diagnostics for $GITHUB_SHA"
          git push -f origin HEAD:ci-logs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

  # R13-P2-06: the release variant is the only one that runs R8 and resource shrinking, and until now
  # nothing in CI ever built it — a keep-rule mistake would have shipped. This job assembles it with a
  # throwaway keystore and publishes the APK size and mapping file so the shrink is evidenced.
  release-build:
    name: Release build (R8 + shrink)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          ok=""
          for url in \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip; do
            if curl -fsSL -o /tmp/cmdline-tools.zip "$url"; then echo "downloaded $url"; ok=1; break; fi
          done
          test -n "$ok"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37" "build-tools;37.0.0" \
            || sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A CI-only signing key. It is generated in the job, never committed, and its passwords exist
      # only for the duration of the run; the resulting APK is a shrink-check artefact, not a release.
      - name: Generate throwaway signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-throwaway -keypass ci-throwaway \
            -dname "CN=CI Release Check, OU=CI, O=Skills Exchange, L=Kampala, C=UG"

      - name: Assemble release
        env:
          # The signing config resolves a relative path against the module directory, so this must be
          # absolute: `my-upload-key.jks` alone looked for app/my-upload-key.jks and failed validation.
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ci-throwaway
          KEY_PASSWORD: ci-throwaway
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee release.log

      - name: Report shrink evidence
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK"
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          test -s "$MAPPING"
          {
            echo "APK: $APK"
            echo "APK size: $(du -h "$APK" | cut -f1) ($(stat -c%s "$APK") bytes)"
            echo "R8 mapping: $(wc -l < "$MAPPING") lines"
            echo "Uncompressed resources: $(unzip -l "$APK" | awk '$4 ~ /^res\// {sum += $1} END {printf "%.1f KB", sum/1024}')"
          } | tee release-summary.txt

      # The artefact API is not reachable from the remediation environment, so the one number this
      # job exists to produce is committed to a metrics branch instead: readable with `git show`.
      - name: Publish size metrics
        if: always()
        run: |
          if [ ! -f release-summary.txt ]; then echo "no summary"; exit 0; fi
          mkdir -p /tmp/metrics/release
          cp release-summary.txt "/tmp/metrics/release/summary-${GITHUB_SHA:0:7}.txt"
          cd /tmp/metrics
          git init -q .
          git add -A
          git -c user.email=ci@users.noreply.github.com -c user.name="CI metrics" \
            commit -qm "ci: release size for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            HEAD:ci-metrics

      - name: Upload release artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-check
          path: |
            release-summary.txt
            release.log
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Publish diagnostics on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          cp -f *.log ci-logs/ 2>/dev/null || true
          {
            printf 'run: %s\ncommit: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf '\n-- workspace logs --\n'
            ls -la *.log 2>/dev/null || echo '(none)'
            printf '\n-- release outputs --\n'
            ls -la app/build/outputs/apk/release 2>/dev/null || echo '(none)'
          } > ci-logs/README.txt
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI diagnostics"
          git checkout --orphan ci-logs-publish
          git add -f ci-logs
          git commit -m "ci: android release diagnostics for $GITHUB_SHA"
          # A separate branch: the compile job also publishes to `ci-logs`, and two jobs forcing the
          # same ref means whichever finishes last erases the other's evidence.
          git push -f origin HEAD:ci-logs-release
