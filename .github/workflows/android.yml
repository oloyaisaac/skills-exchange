# R01-P2-01: compile and unit-test evidence for the Android client.
#
# The sandbox used for remediation has no JDK/Android SDK and cannot reach Google Maven, so the
# build is executed on a GitHub runner, where both are available. This is real execution evidence
# for the commit under test, not a historical claim.
name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
