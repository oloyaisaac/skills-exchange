# REM-005: continuous integration.
#
# Scope today: backend build/tests, documentation integrity and secret scanning. The Android job is
# intentionally absent until REM-001 restores compilation and REM-064 makes the JVM suite runnable;
# adding it now would only produce a permanently red check. The rules job arrives with REM-019.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functions:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  functions-handlers:
    name: Backend handler tests (Firestore emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-audit --no-fund firebase-tools@13
      - name: Run payout handlers on the Firestore emulator
        run: |
          set -euo pipefail
          npx firebase emulators:exec --config ../firebase.json --only firestore \
            --project demo-skills-exchange "npm run test:handlers" 2>&1 | tee "$RUNNER_TEMP/handlers.log"
          grep -E "^# (tests|pass|fail) " "$RUNNER_TEMP/handlers.log"
          # The step only passes when exactly the five handler tests ran and none failed.
          grep -qx "# pass 5" "$RUNNER_TEMP/handlers.log"
          grep -qx "# fail 0" "$RUNNER_TEMP/handlers.log"

  rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: rules-test
      - run: npm install --no-save --no-audit --no-fund firebase-tools@13
      # R07: the rules are executed, not read. Every collection the client touches is exercised for
      # anonymous, stranger, owner, assigned provider and admin actors.
      - name: Run the rules suite against the Firestore emulator
        run: |
          set -euo pipefail
          npx firebase emulators:exec --config firebase.json --only firestore \
            --project demo-skills-exchange "npm --prefix rules-test test" 2>&1 | tee "$RUNNER_TEMP/rules.log"
          grep -E "^# (tests|pass|fail) " "$RUNNER_TEMP/rules.log"
          grep -qx "# fail 0" "$RUNNER_TEMP/rules.log"
      - name: Static Storage-rules check
        run: node rules-test/storage.rules.check.mjs

  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check_doc_links.mjs
      - run: node scripts/check_document_map.mjs
      - run: node scripts/check_traceability.mjs
      - run: node scripts/check_readme_claims.mjs
      - run: node scripts/check_architecture_guards.mjs
      - run: node scripts/check_query_limits.mjs
      - run: node scripts/check_consent_version.mjs
      - run: node scripts/check_no_pii_logs.mjs --selftest
      - run: node scripts/check_no_pii_logs.mjs
      - run: node scripts/check_backup_policy.mjs
      - run: node scripts/secret_scan.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/secret_scan.mjs
