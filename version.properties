# R14-P2-05: the single source of truth for the shipped version.
#
# Both values are read by `app/build.gradle.kts` (and may be overridden per build by the VERSION_CODE /
# VERSION_NAME environment variables in CI). The rules:
#
#   - VERSION_CODE is a positive integer that only ever increases. Play rejects a re-used code, and a
#     re-used code silently blocks an upload while looking like a successful build.
#   - VERSION_NAME is semantic (MAJOR.MINOR.PATCH). A release notes entry in CHANGELOG.md is expected
#     for every MINOR or MAJOR change; PATCH is for fixes.
#   - Before tagging, increment both in the same commit as the CHANGELOG entry, so the artefact and the
#     notes cannot disagree.
VERSION_CODE=1
VERSION_NAME=1.0.0
